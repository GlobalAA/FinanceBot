[project]
name = "app"
packages = [{ include = "app" }]
version = "1"
description = "A simple financial bot for tracking income and expenses. Easy to use, always accessible."
authors = [
    {name = "GlobalAA",email = "globala.personal@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram (>=3.20.0.post0,<4.0.0)",
    "tortoise-orm (>=0.25.1,<0.26.0)",
    "aerich (>=0.9.1,<0.10.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "babel (>=2.17.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "app"  

[tool.poetry.scripts]
start = "app.__main__:main"

[tool.aerich]
tortoise_orm = "app.tortoise_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
